<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ .CSRFToken }}">
    <title>{{ block "title" . }}VPN Panel{{ end }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<aside class="sidebar" id="sidebar">
    <a class="sidebar-brand" href="/">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 9.06-7 10.2-3.87-1.14-7-5.53-7-10.2V6.3l7-3.12z"/></svg>
        VPN Panel
    </a>
    <div class="sidebar-section">Навигация</div>
    <nav class="sidebar-nav">
        <a class="sidebar-link {{ if eq .ActiveTab "dashboard" }}active{{ end }}" href="/"><i class="bi bi-grid-1x2"></i> Обзор</a>
        <a class="sidebar-link {{ if eq .ActiveTab "users" }}active{{ end }}" href="/users"><i class="bi bi-people"></i> Пользователи</a>
        <a class="sidebar-link {{ if eq .ActiveTab "inbounds" }}active{{ end }}" href="/inbounds"><i class="bi bi-diagram-3"></i> Подключения</a>
        <a class="sidebar-link {{ if eq .ActiveTab "logs" }}active{{ end }}" href="/logs"><i class="bi bi-terminal"></i> Логи</a>
        <a class="sidebar-link {{ if eq .ActiveTab "settings" }}active{{ end }}" href="/settings"><i class="bi bi-gear"></i> Настройки</a>
    </nav>
    <div class="sidebar-footer">
        <a class="sidebar-link" href="/logout"><i class="bi bi-box-arrow-left"></i> Выход</a>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
        <span class="topbar-title">{{ block "topbar" . }}{{ end }}</span>
        <span class="topbar-meta">{{ .AdminUsername }}</span>
    </header>
    <div class="content">
        {{ if .FlashMessage }}
        <div class="flash flash-{{ .FlashCategory }}">{{ .FlashMessage }}</div>
        {{ end }}
        {{ block "content" . }}{{ end }}
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/app.js"></script>
{{ block "scripts" . }}{{ end }}
</body>
</html>

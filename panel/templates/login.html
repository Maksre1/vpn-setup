{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block fullpage %}
<div class="login-page">
    <div class="login-box">
        <div class="login-brand">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 9.06-7 10.2-3.87-1.14-7-5.53-7-10.2V6.3l7-3.12z"/></svg>
            VPN Panel
        </div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Логин</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-accent" style="width:100%;justify-content:center;padding:8px 0;">Войти</button>
        </form>
    </div>
</div>
{% endblock %}

<span id="pjax-title" style="display:none;">{% block title %}{% endblock %}</span>
<span id="pjax-topbar" style="display:none;">{% block topbar %}{% endblock %}</span>
<div class="content">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
